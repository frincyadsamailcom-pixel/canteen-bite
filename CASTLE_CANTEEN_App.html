<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CASTLE CANTEEN</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#182230}
:root{--p:#7c3aed;--p2:#5b21b6;--green:#159570;--red:#dc3545;--muted:#667085}
header{background:linear-gradient(135deg,#5b21b6,#8b5cf6);color:#fff;padding:16px 5%;position:sticky;top:0;z-index:20;box-shadow:0 3px 16px #0002}
.nav{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{font-weight:950;font-size:24px}.sub{font-size:11px;opacity:.8}
.navBtns{display:flex;gap:8px;align-items:center}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.white{background:#fff;color:#3f247b}.dark{background:#182230;color:#fff}.primary{background:var(--p);color:#fff}.green{background:var(--green);color:#fff}.danger{background:var(--red);color:#fff}
main{max-width:1200px;margin:25px auto;padding:0 5%}.hero{background:#fff;border-radius:22px;padding:25px;display:flex;justify-content:space-between;align-items:center;gap:20px;box-shadow:0 6px 24px #1018280a;margin-bottom:20px}.hero h1{margin:0 0 8px}.hero p{margin:0;color:var(--muted)}
.controls{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}input,select{border:1px solid #d8dde7;border-radius:11px;padding:12px;background:#fff;font-size:15px;outline:none}.search{flex:1;min-width:220px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #1018280b}.pic{height:135px;display:grid;place-items:center;background:linear-gradient(135deg,#eee5ff,#faf8ff);font-size:60px}.body{padding:15px}.body h3{margin:0 0 6px}.desc{font-size:13px;color:var(--muted);min-height:34px}.price{font-size:18px;font-weight:900;margin:12px 0}.wide{width:100%}
.badge{display:inline-block;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:800;background:#eee;color:#444}.open{background:#dcfce7;color:#166534}.prep{background:#fff7cc;color:#805b00}.ready{background:#dbeafe;color:#1d4ed8}.done{background:#dcfce7;color:#166534}
.panel{background:#fff;border-radius:18px;padding:20px;margin-top:25px;box-shadow:0 5px 20px #1018280a}.panel h2{margin-top:0}.order{border-bottom:1px solid #eee;padding:14px 0;display:flex;justify-content:space-between;gap:12px}.small{font-size:12px;color:var(--muted)}
.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:50}.overlay.show{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(470px,100%);background:#fff;padding:22px;overflow:auto}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.cartitem{border-bottom:1px solid #eee;padding:14px 0}.qty button{border:0;padding:5px 9px;margin:0 3px;border-radius:7px}.total{font-size:20px;font-weight:900;margin:18px 0}.form{display:grid;gap:9px}.note{font-size:12px;color:var(--muted)}.center{text-align:center}.qr{width:180px;height:180px;margin:15px auto;display:grid;place-items:center;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0/20px 20px;border:12px solid #fff;box-shadow:0 2px 10px #0002}.modalCard{max-width:520px;margin:7vh auto;background:#fff;border-radius:20px;padding:25px;max-height:86vh;overflow:auto}.hidden{display:none!important}.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#f7f5ff;padding:18px;border-radius:15px}.stat b{font-size:25px;display:block}.table{overflow:auto}.menuEdit{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
@media(max-width:650px){.hero{display:block}.statgrid{grid-template-columns:1fr}.menuEdit{grid-template-columns:1fr 1fr}.nav .sub{display:none}}
</style>
</head>
<body>
<header><div class="nav"><div><div class="logo">🏰 CASTLE CANTEEN</div><div class="sub">SMART FOOD PRE-ORDERING</div></div><div class="navBtns" id="navBtns"></div></div></header>

<main id="app"></main>

<div class="overlay" id="overlay"><div class="modalCard" id="modal"></div></div>

<script>
const KEY='castleCanteenData';
const defaultData={
 students:[], currentStudent:null, admin:false,
 menu:[
  {id:1,name:'Masala Dosa',cat:'Breakfast',price:45,emoji:'🥞',desc:'Crispy dosa with potato masala and chutney.',active:true},
  {id:2,name:'Idli Sambar',cat:'Breakfast',price:35,emoji:'🍚',desc:'Soft idlis served with hot sambar.',active:true},
  {id:3,name:'Veg Sandwich',cat:'Snacks',price:40,emoji:'🥪',desc:'Fresh vegetables, cheese and toasted bread.',active:true},
  {id:4,name:'Samosa',cat:'Snacks',price:20,emoji:'🥟',desc:'Crispy potato-filled samosa.',active:true},
  {id:5,name:'Veg Fried Rice',cat:'Meals',price:70,emoji:'🍛',desc:'Flavourful rice with fresh vegetables.',active:true},
  {id:6,name:'Paneer Roll',cat:'Meals',price:65,emoji:'🌯',desc:'Paneer, vegetables and sauce in a soft roll.',active:true},
  {id:7,name:'Lemon Juice',cat:'Drinks',price:25,emoji:'🍋',desc:'Refreshing chilled lemon drink.',active:true},
  {id:8,name:'Cold Coffee',cat:'Drinks',price:45,emoji:'🥤',desc:'Chilled creamy coffee.',active:true}
 ],
 orders:[], cart:{}
};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(defaultData);
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function money(n){return '₹'+Number(n).toFixed(2)}
function showModal(x){document.getElementById('modal').innerHTML=x;document.getElementById('overlay').classList.add('show')}
function closeModal(){document.getElementById('overlay').classList.remove('show')}
document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()}

function nav(){
 let b=document.getElementById('navBtns');
 if(data.admin)b.innerHTML=`<button class="btn white" onclick="studentView()">Student View</button><button class="btn white" onclick="logout()">Logout</button>`;
 else if(data.currentStudent)b.innerHTML=`<button class="btn white" onclick="openCart()">🛒 ${cartCount()}</button><button class="btn white" onclick="renderStudent()">My Orders</button><button class="btn white" onclick="logout()">Logout</button>`;
 else b.innerHTML=`<button class="btn white" onclick="login()">Student Login</button><button class="btn white" onclick="adminLogin()">Admin</button>`;
}
function cartCount(){return Object.values(data.cart).reduce((a,b)=>a+b,0)}
function login(){showModal(`<h2>🎓 Student Login</h2><p class="small">Demo login — create a student account using your school details.</p><div class="form"><input id="sname" placeholder="Student name"><input id="sid" placeholder="Student ID / Admission No."><input id="sclass" placeholder="Class / Section"><button class="btn primary" onclick="doLogin()">Continue</button></div>`)}
function doLogin(){let n=sname.value.trim(),id=sid.value.trim(),c=sclass.value.trim();if(!n||!id||!c)return alert('Please fill all fields.');data.currentStudent={name:n,id,cls:c};save();closeModal();renderStudent()}
function adminLogin(){showModal(`<h2>🔐 Admin Login</h2><p class="small">Demo administrator account.</p><div class="form"><input id="apass" type="password" placeholder="Admin password"><button class="btn primary" onclick="doAdmin()">Login</button></div><p class="note">Demo password: <b>castle123</b></p>`)}
function doAdmin(){if(apass.value!=='castle123')return alert('Incorrect demo password.');data.admin=true;data.currentStudent=null;save();closeModal();renderAdmin()}
function logout(){data.currentStudent=null;data.admin=false;save();nav();renderHome()}
function studentView(){data.admin=false;save();renderStudent()}

function renderHome(){nav();document.getElementById('app').innerHTML=`<section class="hero"><div><h1>Welcome to CASTLE CANTEEN 🏰</h1><p>Pre-order your food, choose a pickup time and skip the queue.</p></div><span class="badge open">● Canteen Open</span></section><div class="panel center"><h2>Order food in seconds</h2><p class="small">Student login is required to place an order.</p><button class="btn primary" onclick="login()">🎓 Student Login</button></div>`}
function renderStudent(){nav();let s=data.currentStudent;document.getElementById('app').innerHTML=`
<section class="hero"><div><h1>Hello, ${esc(s.name)} 👋</h1><p>${esc(s.cls)} · ID ${esc(s.id)}</p></div><span class="badge open">● Canteen Open</span></section>
<div class="controls"><input class="search" id="search" placeholder="🔎 Search food..." oninput="renderMenu()"><select id="cat" onchange="renderMenu()"><option>All</option><option>Breakfast</option><option>Snacks</option><option>Meals</option><option>Drinks</option></select><button class="btn primary" onclick="openCart()">🛒 Cart (${cartCount()})</button></div>
<section id="menu" class="grid"></section><section class="panel"><h2>📋 My Recent Orders</h2><div id="myorders"></div></section>`;renderMenu();renderMyOrders()}
function renderMenu(){let q=(document.getElementById('search')?.value||'').toLowerCase(),c=document.getElementById('cat')?.value||'All';let m=data.menu.filter(x=>x.active&&(c==='All'||x.cat===c)&&x.name.toLowerCase().includes(q));document.getElementById('menu').innerHTML=m.length?m.map(f=>`<article class="card"><div class="pic">${f.emoji}</div><div class="body"><h3>${esc(f.name)}</h3><div class="desc">${esc(f.desc)}</div><div class="price">${money(f.price)}</div><button class="btn dark wide" onclick="add(${f.id})">+ Add to cart</button></div></article>`).join(''):'<div class="panel">No food found.</div>'}
function add(id){data.cart[id]=(data.cart[id]||0)+1;save();renderStudent();openCart()}
function change(id,d){data.cart[id]=(data.cart[id]||0)+d;if(data.cart[id]<=0)delete data.cart[id];save();renderStudent();openCart()}
function openCart(){let items=Object.entries(data.cart).map(([id,q])=>{let f=data.menu.find(x=>x.id==id);return f?{...f,q}:null}).filter(Boolean),total=items.reduce((a,x)=>a+x.price*x.q,0);showModal(`<div class="row"><h2>🛒 Your Cart</h2><button class="btn" onclick="closeModal()">✕</button></div>${items.length?items.map(x=>`<div class="cartitem row"><div><b>${x.emoji} ${esc(x.name)}</b><br>${money(x.price)} × ${x.q}</div><div class="qty"><button onclick="change(${x.id},-1)">−</button><b>${x.q}</b><button onclick="change(${x.id},1)">+</button></div></div>`).join(''):`<div class="center"><p>Your cart is empty.</p></div>`}${items.length?`<div class="total row"><span>Total</span><span>${money(total)}</span></div><button class="btn primary wide" onclick="checkout()">Proceed to Checkout</button>`:''}`)}
function checkout(){let items=Object.entries(data.cart).map(([id,q])=>{let f=data.menu.find(x=>x.id==id);return {...f,q}}),total=items.reduce((a,x)=>a+x.price*x.q,0);showModal(`<h2>🕐 Checkout</h2><div class="form"><select id="pickup"><option value="">Select pickup time</option><option>10:30 AM</option><option>11:00 AM</option><option>11:30 AM</option><option>12:00 PM</option><option>12:30 PM</option><option>1:00 PM</option><option>1:30 PM</option><option>2:00 PM</option></select><select id="payment"><option value="counter">💵 Pay at Counter</option><option value="online">📱 Pay Online (UPI)</option></select><div id="paybox"></div><button class="btn primary wide" onclick="confirmOrder()">Place Pre-Order · ${money(total)}</button><p class="note">Online payment is simulated in this prototype. Connect a verified payment gateway/UPI provider before accepting real payments.</p></div>`);payment.onchange=()=>{paybox.innerHTML=payment.value==='online'?`<div class="center"><div class="qr">QR</div><b>Demo UPI QR</b><p class="small">castlecanteen@upi</p><label><input type="checkbox" id="paid"> I completed the demo payment</label></div>`:''}}
function confirmOrder(){if(!pickup.value)return alert('Select a pickup time.');if(payment.value==='online'&&!document.getElementById('paid')?.checked)return alert('Complete the demo UPI payment first.');let items=Object.entries(data.cart).map(([id,q])=>{let f=data.menu.find(x=>x.id==id);return {...f,q}}),total=items.reduce((a,x)=>a+x.price*x.q,0),id='CC'+Math.floor(100000+Math.random()*900000);data.orders.unshift({id,student:{...data.currentStudent},items,total,pickup:pickup.value,payment:payment.value,status:'Received',created:new Date().toLocaleString()});data.cart={};save();showModal(`<div class="center"><div style="font-size:60px">✅</div><h2>Order Confirmed!</h2><p>Your order number</p><div style="font-size:30px;font-weight:950;color:var(--p)">${id}</div><p>Pickup: <b>${pickup.value}</b></p><span class="badge open">Received</span><p class="small">Show your order number at the canteen counter.</p><button class="btn primary wide" onclick="closeModal();renderStudent()">View My Orders</button></div>`);renderStudent()}
function renderMyOrders(){let a=data.orders.filter(o=>o.student.id===data.currentStudent.id);document.getElementById('myorders').innerHTML=a.length?a.slice(0,8).map(orderHTML).join(''):'<div class="small">No orders yet.</div>'}
function orderHTML(o){let cls=o.status==='Preparing'?'prep':o.status==='Ready'?'ready':o.status==='Completed'?'done':'open';return `<div class="order"><div><b>${o.id}</b><br><span class="small">${o.items.map(x=>x.name+' × '+x.q).join(', ')}</span><br><span class="small">Pickup: ${o.pickup}</span></div><div class="center"><span class="badge ${cls}">${o.status}</span><br><b>${money(o.total)}</b></div></div>`}

function renderAdmin(){nav();let pending=data.orders.filter(o=>o.status!=='Completed').length,revenue=data.orders.reduce((a,o)=>a+o.total,0);document.getElementById('app').innerHTML=`<section class="hero"><div><h1>Admin Dashboard 🛠️</h1><p>Manage CASTLE CANTEEN orders and menu.</p></div><span class="badge open">LIVE DEMO</span></section><div class="statgrid"><div class="stat">Active Orders<b>${pending}</b></div><div class="stat">Total Orders<b>${data.orders.length}</b></div><div class="stat">Sales<b>${money(revenue)}</b></div></div><div class="tabs"><button class="btn primary" onclick="adminOrders()">📦 Orders</button><button class="btn dark" onclick="adminMenu()">🍴 Menu Management</button></div><div id="adminArea"></div>`;adminOrders()}
function adminOrders(){document.getElementById('adminArea').innerHTML=`<section class="panel"><h2>📦 Real-Time Order Management</h2><p class="small">Change an order status and the student's order view updates when refreshed.</p>${data.orders.length?data.orders.map((o,i)=>`<div class="order"><div><b>${o.id}</b> · ${esc(o.student.name)} (${esc(o.student.cls)})<br><span class="small">${o.items.map(x=>x.name+' × '+x.q).join(', ')} · Pickup ${o.pickup} · ${o.payment==='online'?'Paid online':'Pay at counter'}</span></div><div><select onchange="setStatus(${i},this.value)"><option ${o.status==='Received'?'selected':''}>Received</option><option ${o.status==='Preparing'?'selected':''}>Preparing</option><option ${o.status==='Ready'?'selected':''}>Ready</option><option ${o.status==='Completed'?'selected':''}>Completed</option></select><br><b>${money(o.total)}</b></div></div>`).join(''):'<p>No orders yet.</p>'}</section>`}
function setStatus(i,v){data.orders[i].status=v;save();adminOrders()}
function adminMenu(){document.getElementById('adminArea').innerHTML=`<section class="panel"><h2>🍴 Menu Management</h2><div class="form"><div class="menuEdit"><input id="newName" placeholder="Food name"><input id="newPrice" type="number" placeholder="Price ₹"><select id="newCat"><option>Breakfast</option><option>Snacks</option><option>Meals</option><option>Drinks</option></select><button class="btn primary" onclick="addMenu()">Add</button></div></div><div style="margin-top:15px">${data.menu.map((f,i)=>`<div class="menuEdit"><span>${f.emoji} <b>${esc(f.name)}</b><br><small>${f.cat} · ${money(f.price)}</small></span><input value="${f.price}" type="number" onchange="data.menu[${i}].price=+this.value;save()"><button class="btn ${f.active?'green':'danger'}" onclick="toggleMenu(${i})">${f.active?'Available':'Hidden'}</button><button class="btn danger" onclick="deleteMenu(${i})">Delete</button></div>`).join('')}</div></section>`}
function addMenu(){let n=newName.value.trim(),p=+newPrice.value,c=newCat.value;if(!n||!p)return alert('Enter food name and price.');data.menu.push({id:Date.now(),name:n,cat:c,price:p,emoji:'🍽️',desc:'Freshly prepared at CASTLE CANTEEN.',active:true});save();adminMenu()}
function toggleMenu(i){data.menu[i].active=!data.menu[i].active;save();adminMenu()}
function deleteMenu(i){if(confirm('Remove this item from the menu?')){data.menu.splice(i,1);save();adminMenu()}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

renderHome();
</script>
</body>
</html>
